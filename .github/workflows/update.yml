name: Update AniList Card

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:


permissions:
  contents: write


jobs:

  update:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}


    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20


    - name: Install dependencies
      run: npm install


    - name: Generate image
      run: node generate.js


    - name: Save image
      run: |

        git config user.name "github-actions"

        git config user.email "github-actions@github.com"

        git add profile.png

        git commit -m "Update AniList profile card" || exit 0

        git push
